<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Playable Phase 1 graybox of GRAM Defenders.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>">
  <title>GRAM Defenders — Phase 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">PHASE 1 · MAP 01</p><h1>GRAM DEFENDERS</h1></div>
      <div class="hud"><span id="wave">Wave 0 / 3</span><span id="hero-hp">VOLYA 500 / 500</span><span id="core">Core ◆◆◆◆</span></div>
    </header>
    <section class="game-wrap">
      <canvas id="game" width="1200" height="675" aria-label="GRAM Defenders game field"></canvas>
      <div id="message" class="message">Tap anywhere to set VOLYA's Guard Point, then start Wave 1.</div>
    </section>
    <footer>
      <div class="battle-actions">
        <button id="start">Start Wave 1</button>
        <button id="hero-skill" class="skill-button" disabled>GRAM Pulse</button>
        <button id="restart" class="secondary">Restart</button>
        <a class="stage-link" href="/stage2.html">Stage 02</a>
      </div>
      <section class="deck" aria-label="Tower deck">
        <span class="deck-label">TOWER LOADOUT</span>
        <button id="tower-card" class="tower-card selected" aria-pressed="true">
          <span class="tower-icon">◆</span><span><strong>Pulse Tower</strong><small>Single target · Build</small></span>
        </button>
        <button id="remove-tower" class="secondary mode-button" aria-pressed="false">Remove</button>
        <span id="build-status">Build mode · Tap T1–T5</span>
      </section>
      <p>Tap anywhere to set VOLYA's Guard Point · He auto-chases one enemy inside the cyan radius · Build towers on T1–T5</p>
    </footer>
  </main>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
